<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  :root{
    --bg:#1B1815;
    --bg-raised:#242019;
    --bg-raised-2:#2C2620;
    --paper:#F3EEE2;
    --paper-2:#EAE3D2;
    --paper-line:#D9D0BC;
    --ink:#2A2620;
    --ink-soft:#8A8171;
    --cream:#EDE7D9;
    --cream-soft:#8F8778;
    --ledger-green:#3C7A63;
    --stamp-red:#A8432F;
    --gold:#C89B3C;
    --divider:#332D24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%; overscroll-behavior-y:none;}
  body{
    background:#0F0D0B;
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh; min-height:100dvh; padding:20px 0;
  }
  .mono{font-family:'IBM Plex Mono',SFMono-Regular,Consolas,monospace;}

  #app{
    width:100%; max-width:420px;
    background:var(--bg);
    border-radius:28px;
    display:flex; flex-direction:column;
    position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
  }

  /* Edge-to-edge, no browser chrome look on phones / installed PWA */
  @media (max-width:480px){
    body{padding:0; align-items:stretch;}
    #app{
      max-width:100%;
      border-radius:0; box-shadow:none;
    }
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    padding:22px 22px 16px;
    padding-top:max(22px, env(safe-area-inset-top));
    color:var(--cream);
  }
  .head-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .dog-mascot{
    position:absolute; right:14px; top:max(12px, env(safe-area-inset-top));
    width:78px; height:83px; cursor:pointer; z-index:5;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));
  }
  .dog-mascot svg{width:100%; height:100%; display:block; transform-origin:50% 95%; animation:dogBreath 3.6s ease-in-out infinite;}
  .dog-mascot svg.hop{animation:dogHop .6s ease;}
  .dog-mascot .mood{display:none;}
  .dog-mascot[data-mood="happy"] .mood-happy,
  .dog-mascot[data-mood="worry"] .mood-worry,
  .dog-mascot[data-mood="sad"] .mood-sad{display:inline;}
  @keyframes dogBreath{0%,100%{transform:scale(1,1);} 50%{transform:scale(1.025,.985);}}
  @keyframes dogHop{
    0%{transform:translateY(0) scale(1,1);}
    25%{transform:translateY(2px) scale(1.06,.92);}
    50%{transform:translateY(-12px) scale(.96,1.05) rotate(-5deg);}
    75%{transform:translateY(0) scale(1.05,.95) rotate(3deg);}
    100%{transform:translateY(0) scale(1,1);}
  }
  .dog-bubble{
    position:absolute; right:14px; top:92px; z-index:6;
    background:var(--paper); color:var(--ink); font-size:12px; font-weight:700;
    padding:6px 11px; border-radius:12px; white-space:nowrap;
    opacity:0; transform:translateY(-4px) scale(.96); transition:opacity .2s, transform .2s;
    pointer-events:none; box-shadow:0 4px 10px rgba(0,0,0,.35);
  }
  .dog-bubble::before{
    content:''; position:absolute; top:-5px; right:34px; width:10px; height:10px;
    background:var(--paper); transform:rotate(45deg);
  }
  .dog-bubble.show{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){
    .dog-mascot svg, .dog-mascot svg.hop{animation:none;}
  }
  .date-line{font-size:12.5px; color:var(--cream-soft); letter-spacing:.02em;}
  .nudge-btn{
    margin-top:10px; font-size:12.5px; color:var(--gold);
    display:none; align-items:center; gap:6px;
    background:var(--bg-raised-2); border:1px dashed var(--gold);
    border-radius:10px; padding:9px 12px; width:100%;
    font-family:'Noto Sans TC'; font-weight:600; cursor:pointer; text-align:left;
  }
  .nudge-btn.show{display:flex;}
  .nudge-btn:active{background:var(--bg-raised);}
  .today-label{margin-top:14px; font-size:13px; color:var(--cream-soft);}
  .today-amount{
    font-family:'IBM Plex Mono',monospace; font-weight:600;
    font-size:40px; color:var(--cream); letter-spacing:-0.5px;
    margin-top:2px;
  }
  .today-amount span{font-size:19px; color:var(--cream-soft); margin-right:4px; font-weight:500;}

  /* ---------- Budget row ---------- */
  .budget-row{margin-top:14px;}
  .budget-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;}
  .budget-text{font-size:12px; color:var(--cream-soft);}
  .budget-edit{
    border:none; background:transparent; color:var(--gold); font-size:11.5px;
    font-family:'Noto Sans TC'; font-weight:600; cursor:pointer; text-decoration:underline; padding:0;
  }
  .budget-bar-track{background:var(--bg-raised-2); border-radius:100px; height:6px; overflow:hidden;}
  .budget-bar-fill{height:100%; border-radius:100px; background:var(--ledger-green); transition:width .3s;}
  .budget-bar-fill.warn{background:var(--gold);}
  .budget-bar-fill.over{background:var(--stamp-red);}

  /* ---------- Input panel (paper) ---------- */
  .paper-panel{
    background:var(--paper);
    border-radius:20px 20px 0 0;
    margin-top:10px;
    padding:18px 18px 10px;
    color:var(--ink);
    box-shadow: 0 -2px 0 rgba(0,0,0,.15) inset;
  }
  .type-toggle{

    padding:3px 8px; border-radius:100px; cursor:pointer; font-family:'Noto Sans TC';

  .amount-display{
    display:flex; align-items:baseline; justify-content:flex-end;

    width:100%; border:1px solid var(--paper-line); background:var(--paper-2); border-radius:10px;

  .note-input:focus{border-color:var(--ink);}
  .modal-input{-webkit-user-select:text; user-select:text;}
  .amount-display.shake{animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }

  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .keypad button{
    background:var(--paper-2); border:none; border-radius:10px;
    padding:13px 0; font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:500;
    color:var(--ink); cursor:pointer;
  }
  .keypad button:active{background:var(--paper-line);}
  .keypad button.zero{grid-column:span 1;}

  .cat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .cat-btn{
    background:var(--bg-raised); border:1px solid var(--divider); border-radius:12px;
    padding:10px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer; color:var(--cream);

  .cat-btn:active{transform:scale(.94);}
  .cat-btn .ic{font-size:19px;}
  .cat-btn .lb{font-size:11px; font-weight:500; color:var(--cream-soft);}
  .paper-panel .cat-grid{margin-top:2px;}

  /* ---------- Tape (record list) ---------- */
  .tape-wrap{
    background:var(--paper); padding:4px 18px 14px;
    color:var(--ink);
  }
  .tape-title{
    font-size:11.5px; letter-spacing:.08em; color:var(--ink-soft); font-weight:700;
    margin:10px 0 6px; text-align:center;
  }
  .row{

    padding:9px 2px; border-bottom:1px dashed var(--paper-line);
    animation:printIn .25s ease;

    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}

  .row .left{display:flex; align-items:center; gap:9px; min-width:0; flex:1;}
  .row .ic{font-size:15px;}
  .row .meta{display:flex; flex-direction:column; min-width:0;}
  .row .cat{font-size:13.5px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .time{font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .row .amt{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;}
  .row .amt.expense{color:var(--stamp-red);}
  .row .amt.income{color:var(--ledger-green);}
  .row .amt.checkin{color:var(--gold); font-size:16px;}
  .row .del, .row .edit{
    border:none; background:transparent; color:var(--ink-soft); font-size:11px;
    padding:4px 6px; cursor:pointer; margin-left:4px; text-decoration:underline; flex-shrink:0;

  .row .edit{margin-left:8px; color:var(--ink);}
  .empty-tape{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0;}

  /* ---------- Stats view ---------- */
  .stats-view{display:none; background:var(--paper); padding:18px; color:var(--ink);}
  .stats-view.show{display:block;}

    display:flex; align-items:center; justify-content:center; gap:16px;
    margin-bottom:16px;
  }
  .month-switch button{
    border:none; background:var(--paper-2); color:var(--ink); width:30px; height:30px;
    border-radius:8px; font-size:16px; cursor:pointer; line-height:1;
  }
  .month-switch button:disabled{opacity:.35; cursor:default;}
  .month-switch .lb{font-size:14px; font-weight:700; font-family:'IBM Plex Mono',monospace; min-width:110px; text-align:center;}

  .stat-card.expense .v{color:var(--stamp-red);}
  .stat-card.income .v{color:var(--ledger-green);}

  .sec-title{font-size:12px; font-weight:700; color:var(--ink-soft); letter-spacing:.04em; margin:0 0 10px;}


  .week-chart{display:flex; align-items:flex-end; gap:8px; height:90px; margin-bottom:24px; padding:0 2px;}
  .week-bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .week-bar .bar{width:100%; background:var(--stamp-red); border-radius:4px 4px 0 0; min-height:3px;}

  .cat-row .fill{height:100%; background:var(--ink); border-radius:6px;}

    flex:1; border:none; background:transparent; padding:8px 0; font-family:'Noto Sans TC';

  nav{

  .modal-overlay{

  .modal-actions{display:flex; gap:8px;}

  .modal-actions .cancel{background:var(--paper-2); color:var(--ink-soft);}
  .modal-actions .confirm{background:var(--ink); color:var(--paper);}
  .modal-actions .danger{background:#EFD9D2; color:var(--stamp-red); flex:0 0 auto; padding-left:14px; padding-right:14px;}
  .modal-actions .danger.armed{background:var(--stamp-red); color:var(--paper);}

  .edit-cats{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:12px;}
  .edit-cat{
    border:1px solid var(--paper-line); background:var(--paper); border-radius:10px;
    padding:6px 0 5px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;

  .item-row{cursor:pointer;}
  .item-row .pen{font-size:11px; opacity:.55; margin-left:2px;}
</style>

<script>
const EXPENSE_CATS = [
  {k:'solo_meal', ic:'🍜', lb:'個人'},
  {k:'social_meal', ic:'🍻', lb:'聚餐'},
  {k:'transport', ic:'🚌', lb:'交通'},
  {k:'shopping', ic:'🛍️', lb:'購物'},
  {k:'fun', ic:'🎬', lb:'娛樂'},
  {k:'daily', ic:'🧴', lb:'日用'},
  {k:'medical', ic:'💊', lb:'醫療'},
  {k:'rent', ic:'🏠', lb:'房租'},
  {k:'bills', ic:'💡', lb:'帳單'},
  {k:'other_e', ic:'📎', lb:'其他'},
];
const INCOME_CATS = [
  {k:'salary', ic:'💰', lb:'薪資'},
  {k:'bonus', ic:'🎁', lb:'獎金'},
  {k:'invest', ic:'📈', lb:'投資'},
  {k:'other_i', ic:'📎', lb:'其他'},
];
const CAT_LOOKUP = {};
[...EXPENSE_CATS, ...INCOME_CATS].forEach(c => CAT_LOOKUP[c.k] = c);
CAT_LOOKUP['checkin'] = {k:'checkin', ic:'🌱', lb:'無消費'};
CAT_LOOKUP['food'] = {k:'food', ic:'🍽️', lb:'餐飲'};  // 舊版分類，只保留給已記錄的資料顯示
const OTHER_KEYS = ['other_e', 'other_i'];

let state = {
  entries: [],
  amountStr: '',
  type: 'expense',
  budget: null,          // {amount}
  statsMonthOffset: 0,   // 0 = current month, -1 = previous month, etc.
  statsView: 'day',       // 'day' | 'month'
  statsDayAgo: 0,         // 0 = today, 1 = yesterday, ...
  calOpen: false,         // mini calendar visible in the day view
  edit: null,             // entry currently being edited {id, type, category, origCategory}
  importPending: null,    // parsed CSV rows waiting for the user's confirmation
  calMonthAgo: 0,         // month shown in the mini calendar (0 = this month)
  entryDateKey: null,     // date the next logged entry will be filed under (yyyy-mm-dd); set in init()
  modal: {mode:null, catKey:null},
};

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function todayKey(){ return dateKey(Date.now()); }
function fmt(n){
  return Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
}
function monthKeyForOffset(offset){
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + offset);
  return {key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`, date:d};
}
function dateKeyOffset(daysAgo){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return dateKey(d.getTime());
}
function tsForDateKey(dateKeyStr){
  const now = new Date();
  const [y,m,d] = dateKeyStr.split('-').map(Number);
  return new Date(y, m-1, d, now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds()).getTime();
}

/* ---------- Storage layer ----------
   Uses Claude's built-in artifact storage (window.storage) when this page is
   running inside a Claude chat/preview. When opened standalone (downloaded
   file, added to Home Screen, hosted elsewhere) that bridge doesn't exist,
   so it falls back to the browser's own localStorage, which persists fine
   on-device once it's a normal page. Each environment keeps its own copy —
   they are not synced with each other. */
const LS_PREFIX = 'jizhangben_v1_';
const hasClaudeStorage = (typeof window.storage !== 'undefined' && !!window.storage);

async function storageGet(key){
  if(hasClaudeStorage){
    try{
      const r = await window.storage.get(key, false);
      if(r) return r;
    }catch(e){ /* fall through to local */ }
  }
  try{
    const v = localStorage.getItem(LS_PREFIX + key);
    return v !== null ? {key, value:v} : null;
  }catch(e){
    return null;
  }
}
async function storageSet(key, value){
  let ok = false;
  if(hasClaudeStorage){
    try{
      const r = await window.storage.set(key, value, false);
      ok = !!r;
    }catch(e){ ok = false; }
  }
  try{
    localStorage.setItem(LS_PREFIX + key, value);
    ok = true;
  }catch(e){ /* localStorage unavailable, keep whatever ok already is */ }
  return ok;
}

async function init(){
  try{
    const res = await storageGet('entries');
    state.entries = res && res.value ? JSON.parse(res.value) : [];
    state.entries = state.entries.filter(e => CAT_LOOKUP[e.category]);
  }catch(e){
    state.entries = [];
  }
  try{
    const b = await storageGet('budget');
    state.budget = b && b.value ? JSON.parse(b.value) : null;
  }catch(e){
    state.budget = null;
  }
  document.getElementById('dateLine').textContent = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
  state.entryDateKey = todayKey();
  document.getElementById('customDateInput').max = todayKey();
  renderCatGrid();
  renderAll();
  document.getElementById('loading').style.display = 'none';
}

async function persistEntries(){
  const ok = await storageSet('entries', JSON.stringify(state.entries));
  if(!ok) showToast('儲存失敗，稍後會再試一次');
}
async function persistBudget(){
  const ok = await storageSet('budget', JSON.stringify(state.budget));
  if(!ok) showToast('預算儲存失敗');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

function setType(type){
  state.type = type;
  document.getElementById('typeExpense').classList.toggle('active', type==='expense');
  document.getElementById('typeIncome').classList.toggle('active', type==='income');
  renderCatGrid();
}

function renderCatGrid(){
  const cats = state.type === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  const grid = document.getElementById('catGrid');
  grid.style.gridTemplateColumns = `repeat(${cats.length > 8 ? 5 : 4}, 1fr)`;
  grid.innerHTML = cats.map(c => `
    <div class="cat-btn" onclick="requestLog('${c.k}')">
      <div class="ic">${c.ic}</div>
      <div class="lb">${c.lb}</div>
    </div>
  `).join('');
}

function digit(d){
  if(d === '.' && state.amountStr.includes('.')) return;
  if(state.amountStr === '0' && d !== '.') state.amountStr = '';
  if(state.amountStr.includes('.')){
    const decimals = state.amountStr.split('.')[1];
    if(decimals && decimals.length >= 2) return;
  }
  if(state.amountStr.length >= 10) return;
  state.amountStr += d;
  document.getElementById('amountVal').textContent = state.amountStr || '0';
}

function backspace(){
  state.amountStr = state.amountStr.slice(0, -1);
  document.getElementById('amountVal').textContent = state.amountStr || '0';
}

function requestLog(catKey){
  const amount = parseFloat(state.amountStr);
  if(!amount || amount <= 0){
    const disp = document.getElementById('amountDisplay');
    disp.classList.remove('shake');
    void disp.offsetWidth;
    disp.classList.add('shake');
    return;
  }
  const note = document.getElementById('noteInput').value.trim().slice(0, 24);
  // 「其他」如果還沒寫備註，就跳出視窗問一下；其他類別直接記錄
  if(OTHER_KEYS.includes(catKey) && !note){
    openNoteModal(catKey);
  }else{
    finalizeEntry(catKey, note);
  }
}

function finalizeEntry(catKey, note){
  const amount = parseFloat(state.amountStr);
  if(!amount || amount <= 0) return;

  const moodBefore = dogMood;
  const entryTs = tsForDateKey(state.entryDateKey);
  const monthKey = monthKeyForOffset(0).key;
  const prevMonthExpense = state.entries
    .filter(e => e.type === 'expense' && dateKey(e.ts).startsWith(monthKey))
    .reduce((s,e)=>s+e.amount, 0);

  const entry = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
    amount: amount,
    type: state.type,
    category: catKey,
    note: note || '',
    ts: entryTs,
  };
  state.entries.push(entry);
  state.entries.sort((a,b) => b.ts - a.ts);
  state.amountStr = '';
  document.getElementById('amountVal').textContent = '0';
  document.getElementById('noteInput').value = '';
  persistEntries();

  // Only count toward this month's budget if the entry actually falls in the current month
  if(entry.type === 'expense' && state.budget && state.budget.amount > 0 && dateKey(entryTs).startsWith(monthKey)){
    const newTotal = prevMonthExpense + amount;
    checkBudgetToast(prevMonthExpense, newTotal, state.budget.amount);
  }

  renderAll();
  dogReactToLog(entry.type, moodBefore);
}

function checkBudgetToast(prevTotal, newTotal, budgetAmt){
  if(prevTotal < budgetAmt && newTotal >= budgetAmt){
    showToast('⚠️ 本月支出已超過預算了');
  }else if(prevTotal < budgetAmt*0.8 && newTotal >= budgetAmt*0.8){
    showToast('本月支出已達預算的 80%');
  }
}

function deleteEntry(id){
  state.entries = state.entries.filter(e => e.id !== id);
  persistEntries();
  renderAll();
}

function logCheckin(dateKeyStr){
  if(state.entries.some(e => dateKey(e.ts) === dateKeyStr)){
    showToast('這天已經有紀錄了');
    return;
  }
  const entry = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
    amount: 0,
    type: 'checkin',
    category: 'checkin',
    note: '',
    ts: tsForDateKey(dateKeyStr),
  };
  state.entries.push(entry);
  state.entries.sort((a,b) => b.ts - a.ts);
  persistEntries();
  renderAll();
  dogHop();
  dogSay(dateKeyStr === todayKey() ? '今天沒花錢，好棒！🌱' : '補好了 🌱', 1800);
  showToast(dateKeyStr === todayKey() ? '已紀錄：今日沒花錢 🌱' : '已補上無消費紀錄 🌱');
}

function setEntryDate(daysAgo){
  state.entryDateKey = dateKeyOffset(daysAgo);
  renderDateRow();
}
function setEntryDateCustom(val){
  if(!val) return;
  if(val > todayKey()) val = todayKey(); // no future dates
  state.entryDateKey = val;
  renderDateRow();
}
function renderDateRow(){
  const todayK = todayKey();
  const chips = document.querySelectorAll('.date-chip');
  const offsets = [0, 1, 2];
  chips.forEach((btn, i) => {
    btn.classList.toggle('active', state.entryDateKey === dateKeyOffset(offsets[i]));
  });
  const input = document.getElementById('customDateInput');
  if(input) input.value = state.entryDateKey;

  const note = document.getElementById('dateNote');
  if(!note) return;
  if(state.entryDateKey === todayK){
    note.classList.remove('show');
    note.innerHTML = '';
  }else{
    const d = new Date(state.entryDateKey + 'T00:00:00');
    const label = `${d.getMonth()+1}/${d.getDate()}（${['日','一','二','三','四','五','六'][d.getDay()]}）`;
    note.classList.add('show');
    const hasEntry = state.entries.some(e => dateKey(e.ts) === state.entryDateKey);
    note.innerHTML = `📅 正在為 ${label} 補記` +
      ` <button class="date-note-link" onclick="setEntryDate(0)">回到今天</button>` +
      (hasEntry ? '' : ` <button class="date-note-link" onclick="logCheckin('${state.entryDateKey}')">這天沒花錢</button>`);
  }
}


function renderAll(){
  const tKey = todayKey();
  const todayEntries = state.entries.filter(e => dateKey(e.ts) === tKey);
  const todayExpense = todayEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  document.getElementById('todayExpense').textContent = fmt(todayExpense);
  document.getElementById('nudgeBtn').classList.toggle('show', !todayEntries.length);


  renderBudgetBar();

  const tapeList = document.getElementById('tapeList');
  if(!state.entries.length){
    tapeList.innerHTML = `<div class="empty-tape">還沒有任何記錄<br>輸入金額，點選分類即可記一筆</div>`;
  }else{
    tapeList.innerHTML = state.entries.slice(0, 200).map(e => {
      const c = CAT_LOOKUP[e.category];
      const d = new Date(e.ts);
      const timeStr = `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const sign = e.type === 'expense' ? '-' : '+';
      const amtDisplay = e.type === 'checkin' ? '✓' : `${sign}${fmt(e.amount)}`;
      const label = e.note ? escapeHtml(e.note) : c.lb;
      const subLine = e.note ? `${c.lb} · ${timeStr}` : timeStr;
      return `
        <div class="row">
          <div class="left">
            <div class="ic">${c.ic}</div>
            <div class="meta">
              <div class="cat">${label}</div>
              <div class="time">${subLine}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center;">
            <div class="amt ${e.type}">${amtDisplay}</div>
            ${e.type === 'checkin' ? '' : `<button class="edit" onclick="openEdit('${e.id}')">編輯</button>`}
            <button class="del" onclick="deleteEntry('${e.id}')">刪除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  renderDateRow();
  renderStats();
}

/* ---------- Dog mascot ---------- */
let dogMood = 'happy';
let dogBubbleTimer = null;
let dogLastLine = -1;

const DOG_LINES = {
  happy: ['汪！', '摸摸我～', '今天也要記帳喔 🐾', '我最喜歡你了 💕', '記完帳要不要喝杯飲料？', '汪汪！', '尾巴搖搖～'],
  worry: ['預算有點緊喔…', '再花下去錢包要哭了 😰', '要不要先看看統計？'],
  sad:   ['嗚…預算爆掉了', '下個月一起加油 💪', '先深呼吸，我陪你'],
};
const DOG_LOG_LINES = {
  expense: ['記好囉！🐾', '收到！汪', '有記有保佑 ✨', '又完成一筆～'],
  income:  ['有收入！汪汪 🎉', '太棒了！🎉', '錢錢進來～💰'],
};

function setDogMood(mood){
  dogMood = mood;
  const el = document.getElementById('dogMascot');
  if(el) el.dataset.mood = mood;
}
function dogSay(text, ms){
  const b = document.getElementById('dogBubble');
  if(!b) return;
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(dogBubbleTimer);
  dogBubbleTimer = setTimeout(() => b.classList.remove('show'), ms || 2200);
}
function dogHop(){
  const svg = document.querySelector('#dogMascot svg');
  if(!svg) return;
  svg.classList.remove('hop');
  void svg.getBoundingClientRect();
  svg.classList.add('hop');
  clearTimeout(dogHop._t);
  dogHop._t = setTimeout(() => svg.classList.remove('hop'), 650);
}
function pickLine(list){
  let i = Math.floor(Math.random() * list.length);
  if(list.length > 1 && i === dogLastLine) i = (i + 1) % list.length;
  dogLastLine = i;
  return list[i];
}
function petDog(){
  dogHop();
  dogSay(pickLine(DOG_LINES[dogMood] || DOG_LINES.happy));
}
function dogReactToLog(type, moodBefore){
  dogHop();
  if(dogMood !== moodBefore && dogMood === 'worry'){
    dogSay('預算用到 80% 了，小心喔 😰', 2800);

function renderBudgetBar(){
  const monthKey = monthKeyForOffset(0).key;
  const monthExpense = state.entries
    .filter(e => e.type === 'expense' && dateKey(e.ts).startsWith(monthKey))
    .reduce((s,e)=>s+e.amount, 0);

  const fillEl = document.getElementById('budgetFill');

  if(!state.budget || !state.budget.amount){
    textEl.textContent = '尚未設定本月預算';

    fillEl.className = 'budget-bar-fill';
    setDogMood('happy');

  }
  const budgetAmt = state.budget.amount;
  const pct = Math.min((monthExpense / budgetAmt) * 100, 100);
  textEl.textContent = `本月預算 NT$${fmt(monthExpense)} / NT$${fmt(budgetAmt)}（${Math.round((monthExpense/budgetAmt)*100)}%）`;
  fillEl.style.width = pct + '%';
  fillEl.className = 'budget-bar-fill' + (monthExpense >= budgetAmt ? ' over' : (monthExpense >= budgetAmt*0.8 ? ' warn' : ''));

}

function renderMonthStats(){
  const {key: monthKey, date: monthDate} = monthKeyForOffset(state.statsMonthOffset);
  document.getElementById('monthLabel').textContent = `${monthDate.getFullYear()}年${monthDate.getMonth()+1}月`;
  document.getElementById('nextMonthBtn').disabled = state.statsMonthOffset >= 0;

  const monthEntries = state.entries.filter(e => dateKey(e.ts).startsWith(monthKey));
  const monthExpense = monthEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const monthIncome = monthEntries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  document.getElementById('monthExpense').textContent = 'NT$' + fmt(monthExpense);
  document.getElementById('monthIncome').textContent = 'NT$' + fmt(monthIncome);

  const isCurrentMonth = state.statsMonthOffset === 0;
  document.getElementById('weekChartSection').style.display = isCurrentMonth ? '' : 'none';
  if(isCurrentMonth){
    const days = [];
    for(let i=6;i>=0;i--){
      const d = new Date();
      d.setDate(d.getDate()-i);
      days.push(d);
    }
    const dayTotals = days.map(d => {
      const key = dateKey(d.getTime());
      return state.entries.filter(e=>e.type==='expense' && dateKey(e.ts)===key).reduce((s,e)=>s+e.amount,0);
    });
    const maxVal = Math.max(...dayTotals, 1);
    const weekChart = document.getElementById('weekChart');
    weekChart.innerHTML = days.map((d,i) => {
      const h = Math.max((dayTotals[i]/maxVal)*100, dayTotals[i]>0 ? 6 : 2);
      const lb = ['日','一','二','三','四','五','六'][d.getDay()];
      return `<div class="week-bar"><div class="bar" style="height:${h}%"></div><div class="lb">${lb}</div></div>`;
    }).join('');
  }

  const catTotals = {};
  monthEntries.filter(e=>e.type==='expense').forEach(e => {
    catTotals[e.category] = (catTotals[e.category]||0) + e.amount;
  });
  const entries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catBreakdown = document.getElementById('catBreakdown');
  if(!entries.length){
    catBreakdown.innerHTML = `<div class="empty-stats">這個月還沒有支出記錄</div>`;
  }else{
    const maxCat = entries[0][1];
    catBreakdown.innerHTML = entries.map(([k,v]) => {
      const c = CAT_LOOKUP[k];
      const pct = Math.max((v/maxCat)*100, 4);
      return `
        <div class="cat-row">
          <div class="top">
            <div class="nm">${c.ic} ${c.lb}</div>
            <div class="amt">NT$${fmt(v)}</div>
          </div>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }).join('');
  }
}

  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function calSyncToSelected(){
  const [y, m] = dateKeyOffset(state.statsDayAgo).split('-').map(Number);
  const now = new Date();
  state.calMonthAgo = Math.max(0, (now.getFullYear() * 12 + now.getMonth()) - (y * 12 + (m - 1)));
}

  state.calOpen = !state.calOpen;

function changeCalMonth(delta){
  const next = state.calMonthAgo - delta;   // delta -1 = previous month
  if(next < 0) return;
  state.calMonthAgo = next;

}
function pickDay(key){
  if(key > todayKey()) return;
  const [y, m, d] = key.split('-').map(Number);
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  state.statsDayAgo = Math.max(0, Math.round((startToday - new Date(y, m - 1, d)) / 86400000));
  state.calOpen = false;
  renderStats();
}
function renderCalendar(){
  const first = new Date();
  first.setDate(1);
  first.setMonth(first.getMonth() - state.calMonthAgo);
  const y = first.getFullYear(), m = first.getMonth();
  document.getElementById('calTitle').textContent = `${y}年${m + 1}月`;
  document.getElementById('calNextBtn').disabled = state.calMonthAgo === 0;

  const prefix = `${y}-${pad(m + 1)}-`;
  const flags = {};   // dateKey -> 'exp' | 'inc' | 'chk'
  state.entries.forEach(e => {
    const k = dateKey(e.ts);
    if(!k.startsWith(prefix)) return;
    const cur = flags[k];
    if(e.type === 'expense') flags[k] = 'exp';
    else if(e.type === 'income' && cur !== 'exp') flags[k] = 'inc';
    else if(e.type === 'checkin' && !cur) flags[k] = 'chk';
  });

  const selectedKey = dateKeyOffset(state.statsDayAgo);
  const todayK = todayKey();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const lead = first.getDay();
  let cells = '';
  for(let i = 0; i < lead; i++) cells += '<div></div>';
  for(let day = 1; day <= daysInMonth; day++){
    const key = `${prefix}${pad(day)}`;
    const cls = [
      key === todayK ? 'today' : '',
      key === selectedKey ? 'selected' : '',
      flags[key] ? 'has has-' + flags[key] : '',
    ].filter(Boolean).join(' ');
    cells += `<button class="${cls}" ${key > todayK ? 'disabled' : ''} onclick="pickDay('${key}')">${day}</button>`;
  }
  document.getElementById('calGrid').innerHTML = cells;
}
function dayLabelText(daysAgo){
  const [y, m, d] = dateKeyOffset(daysAgo).split('-').map(Number);
  const wd = ['日','一','二','三','四','五','六'][new Date(y, m-1, d).getDay()];
  const suffix = daysAgo === 0 ? ' · 今天' : daysAgo === 1 ? ' · 昨天' : daysAgo === 2 ? ' · 前天' : '';
  return `${m}/${d}（${wd}）${suffix}`;
}

function catGroupsHTML(list, total, fillClass){
  const groups = {};
  list.forEach(e => { (groups[e.category] = groups[e.category] || []).push(e); });
  return Object.entries(groups)
    .map(([k, items]) => ({k, items, sum: items.reduce((s,e)=>s+e.amount, 0)}))
    .sort((a,b) => b.sum - a.sum)
    .map(g => {
      const c = CAT_LOOKUP[g.k];
      const pct = total > 0 ? (g.sum / total) * 100 : 0;
      const pctText = pct > 0 && pct < 1 ? '<1%' : Math.round(pct) + '%';
      const rows = g.items.slice().sort((a,b) => b.ts - a.ts).map(e => {
        const d = new Date(e.ts);
        const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        return `<div class="item-row" onclick="openEdit('${e.id}')"><span class="t">${t}</span><span class="n">${e.note ? escapeHtml(e.note) : '—'}</span><span class="a">${fmt(e.amount)}</span><span class="pen">✏️</span></div>`;
      }).join('');
      return `
        <details class="cat-detail">
          <summary>
            <div class="cat-row">
              <div class="top">
                <div class="nm">${c.ic} ${c.lb} <span class="meta">${g.items.length} 筆 · ${pctText}</span></div>
                <div class="amt-wrap"><div class="amt">NT$${fmt(g.sum)}</div><span class="chev">▼</span></div>
              </div>
              <div class="track"><div class="fill ${fillClass || ''}" style="width:${Math.max(pct, 3)}%"></div></div>
            </div>
          </summary>
          <div class="items">${rows}</div>
        </details>`;
    }).join('');
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQ = false;
  const pushRow = () => {
    row.push(field); field = '';
    if(row.some(c => c.trim() !== '')) rows.push(row);
    row = [];
  };
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i + 1] === '"'){ field += '"'; i++; } else inQ = false;
      }else field += ch;
    }else if(ch === '"') inQ = true;
    else if(ch === ','){ row.push(field); field = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; pushRow(); }
    else field += ch;
  }
  if(field !== '' || row.length) pushRow();
  return rows;
}

const CSV_CAT_ALIASES = {'一人食':'solo_meal', '個人餐飲':'solo_meal', '朋友餐飲':'social_meal'};
function csvCategoryKey(type, label){
  const lb = (label || '').trim();
  if(type === 'checkin') return {key:'checkin', known:true};
  if(CSV_CAT_ALIASES[lb] && type === 'expense') return {key:CSV_CAT_ALIASES[lb], known:true};
  if(type === 'expense' && lb === '餐飲') return {key:'food', known:true};
  const list = type === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  const hit = list.find(c => c.lb === lb);
  if(hit) return {key:hit.k, known:true};
  return {key: type === 'expense' ? 'other_e' : 'other_i', known:false};
}
function csvEntryKey(ts, type, category, amount, note){
  const d = new Date(ts);
  return [dateKey(ts), pad(d.getHours()) + ':' + pad(d.getMinutes()), type, category, Number(amount), note || ''].join('|');
}

function analyzeCSV(text){
  const rows = parseCSV(text);
  const result = {total:0, toAdd:[], dup:0, invalid:0, remapped:0};
  if(!rows.length) return result;

  // locate columns by header name; fall back to the exported order
  const head = rows[0].map(c => c.trim());
  const hasHeader = head.includes('日期') || head.includes('金額');
  const idx = name => head.indexOf(name);
  const col = hasHeader
    ? {date:idx('日期'), time:idx('時間'), type:idx('類型'), cat:idx('分類'), amt:idx('金額'), note:idx('備註')}
    : {date:0, time:1, type:2, cat:3, amt:4, note:5};
  if(col.date < 0 || col.amt < 0 || col.type < 0) return result;

  // multiset of what already exists, so re-importing the same file adds nothing
  const existing = {};
  state.entries.forEach(e => {
    const k = csvEntryKey(e.ts, e.type, e.category, e.amount, e.note);
    existing[k] = (existing[k] || 0) + 1;
  });

  rows.slice(hasHeader ? 1 : 0).forEach(r => {
    result.total++;
    const get = i => (i >= 0 && i < r.length ? r[i].trim() : '');
    const dm = get(col.date).match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    const tm = (get(col.time) || '00:00').match(/^(\d{1,2}):(\d{2})/);
    const typeStr = get(col.type);
    const type = typeStr === '支出' ? 'expense' : typeStr === '收入' ? 'income' : (typeStr === '無消費' || typeStr === '打卡') ? 'checkin' : null;
    const amount = parseFloat(get(col.amt).replace(/[,\s]/g, ''));
    if(!dm || !tm || !type || isNaN(amount) || (type !== 'checkin' && amount <= 0)){ result.invalid++; return; }

    const y = +dm[1], m = +dm[2], d = +dm[3], hh = +tm[1], mm = +tm[2];
    const dt = new Date(y, m - 1, d, hh, mm, 0, 0);
    if(dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d || hh > 23 || mm > 59){ result.invalid++; return; }

    const cat = csvCategoryKey(type, get(col.cat));
    let note = get(col.note).slice(0, 24);
    if(!cat.known && !note) note = get(col.cat).slice(0, 24);   // keep the unknown category name as a note
    if(!cat.known) result.remapped++;

    const ts = dt.getTime();
    const amt = type === 'checkin' ? 0 : Math.round(amount * 100) / 100;
    const k = csvEntryKey(ts, type, cat.key, amt, note);
    if(existing[k] > 0){ existing[k]--; result.dup++; return; }
    result.toAdd.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 9) + result.toAdd.length,
      amount: amt, type, category: cat.key, note, ts,
    });
  });
  return result;
}

function onCsvFileChosen(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => { handleImportText(String(reader.result || '')); input.value = ''; };
  reader.onerror = () => { showToast('讀取檔案失敗'); input.value = ''; };
  reader.readAsText(file, 'utf-8');
}

function handleImportText(text){
  const res = analyzeCSV(text);
  if(!res.total){
    showToast('這個檔案裡找不到可以匯入的紀錄');
    return;
  }
  if(!res.toAdd.length){
    showToast(res.dup ? `這 ${res.dup} 筆都已經在了，沒有新紀錄` : '沒有可以匯入的紀錄，請確認是從這個 App 匯出的 CSV');
    return;
  }
  state.importPending = res;
  state.modal = {mode:'import', catKey:null};
  const lines = [`找到 ${res.total} 筆紀錄`, `✅ 新增 ${res.toAdd.length} 筆`];
  if(res.dup) lines.push(`⏭ 已存在，會略過 ${res.dup} 筆`);
  if(res.invalid) lines.push(`⚠️ 無法辨識，會略過 ${res.invalid} 筆`);
  if(res.remapped) lines.push(`ℹ️ ${res.remapped} 筆的分類不認識，已歸到「其他」`);
  document.getElementById('modalTitle').textContent = '匯入 CSV';
  const sub = document.getElementById('modalSub');
  sub.textContent = lines.join('\n');
  sub.style.whiteSpace = 'pre-line';
  document.getElementById('modalInput').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('show');
}

function applyImport(res){
  if(!res || !res.toAdd.length) return;
  state.entries.push(...res.toAdd);
  state.entries.sort((a, b) => b.ts - a.ts);
  persistEntries();
  renderAll();
  showToast(`已匯入 ${res.toAdd.length} 筆紀錄`);
  dogHop();
  dogSay('資料回來囉 🐾', 1800);
}

/* ---------- CSV export ---------- */
function csvEscape(v){
  const s = String(v);
  if(s.includes(',') || s.includes('"') || s.includes('\n')){
    return '"' + s.replace(/"/g,'""') + '"';
  }
  return s;
}
function buildCSV(){
  const header = ['日期','時間','類型','分類','金額','備註'].join(',') + '\n';
  const rows = state.entries.slice().sort((a,b)=>a.ts-b.ts).map(e => {
    const c = CAT_LOOKUP[e.category];
    const d = new Date(e.ts);
    const dateStr = `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
    const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const typeStr = e.type === 'expense' ? '支出' : (e.type === 'income' ? '收入' : '無消費');
    return [dateStr, timeStr, typeStr, c.lb, e.amount, e.note || ''].map(csvEscape).join(',');
  }).join('\n');
  const csvText = '\uFEFF' + header + rows;
  const filename = `記帳紀錄_${todayKey()}.csv`;
  return {csvText, filename};
}

function exportCSV(){
  if(!state.entries.length){
    showToast('目前沒有紀錄可以匯出');
    return;
  }
  const {csvText, filename} = buildCSV();
  const blob = new Blob([csvText], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已下載 CSV');
}

async function shareCSV(){
  if(!state.entries.length){
    showToast('目前沒有紀錄可以匯出');
    return;
  }
  const {csvText, filename} = buildCSV();
  const blob = new Blob([csvText], {type:'text/csv;charset=utf-8;'});

  if(navigator.share && navigator.canShare){
    try{
      const file = new File([blob], filename, {type:'text/csv'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'記帳紀錄', text:'記帳紀錄 CSV'});
        return;
      }
    }catch(err){
      if(err && err.name === 'AbortError') return; // user closed the share sheet, do nothing
      // otherwise fall through to download fallback below
    }
  }
  // Web Share isn't available here (e.g. inside the chat preview) — fall back to a normal download
  exportCSV();
  showToast('此環境不支援分享，已改為下載 CSV');
}

init();
</script>
